name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1 -Version ${{ steps.ver.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: OopzPtt-${{ steps.ver.outputs.version }}
          path: |
            dist/OopzPtt.exe
            dist/oopz-ptt.user.js
            dist/oopz-ptt-extension.zip
            dist/OopzPtt-*-win-x64.zip

      - name: Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @('dist/OopzPtt.exe', 'dist/oopz-ptt.user.js', 'dist/oopz-ptt-extension.zip') + (Get-ChildItem dist/OopzPtt-*-win-x64.zip).FullName
          gh release create $env:GITHUB_REF_NAME @files --title $env:GITHUB_REF_NAME --generate-notes
